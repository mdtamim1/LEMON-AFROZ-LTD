<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width"/>
  <title>YouTube Email Template</title>
  <!--
  ============================================================
  HOW TO USE IN GMAIL:
  1. এই file টা browser-এ open করুন
  2. সব কিছু Select All (Ctrl+A) করুন
  3. Copy করুন (Ctrl+C)
  4. Gmail compose window-এ Paste করুন (Ctrl+V)
  5. Send করুন!
  ============================================================
  -->
</head>
<body style="margin:0;padding:0;background-color:#f1f1f1;font-family:Roboto,Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f1f1f1;padding:20px 0;">
  <tr>
    <td align="center">

      <!-- Email Card -->
      <table width="600" cellpadding="0" cellspacing="0" border="0"
        style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

        <!-- YouTube Header -->
        <tr>
          <td style="background:#ffffff;padding:16px 24px;border-bottom:1px solid #f0f0f0;">
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td>
                  <img src="https://www.youtube.com/img/desktop/yt_1200.png"
                    alt="YouTube" width="90" height="20"
                    style="display:block;height:20px;width:auto;"/>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Message Body -->
        <tr>
          <td style="padding:24px 24px 0;">
            <p style="margin:0 0 16px;font-size:14px;color:#0d0d0d;line-height:1.5;">
              <strong>Lemon Afroz Ltd</strong> shared a video with you:
            </p>
          </td>
        </tr>

        <!-- Video Thumbnail (clickable) -->
        <tr>
          <td style="padding:0 24px;">
            <a href="https://teramerarishta.netlify.app" target="_blank"
              style="display:block;text-decoration:none;border-radius:8px;overflow:hidden;position:relative;">
              <img
                src="https://img.youtube.com/vi/v748ahm0t6A/maxresdefault.jpg"
                alt="তুমি কি আমায় বৌ বানাইবা"
                width="552"
                style="width:100%;max-width:552px;height:auto;display:block;border-radius:8px;"/>
              <!-- Play button overlay -->
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/YouTube_play_button_icon_%282013%E2%80%932017%29.svg/200px-YouTube_play_button_icon_%282013%E2%80%932017%29.svg.png"
                  width="64" height="64" alt="Play" style="opacity:0.9;"/>
              </div>
            </a>
          </td>
        </tr>

        <!-- Video Info -->
        <tr>
          <td style="padding:16px 24px 8px;">
            <a href="https://teramerarishta.netlify.app" target="_blank"
              style="text-decoration:none;color:#0d0d0d;">
              <p style="margin:0 0 6px;font-size:16px;font-weight:700;color:#0d0d0d;line-height:1.4;">
                তুমি কি আমায় বৌ বানাইবা (Official Music Video)
              </p>
              <p style="margin:0;font-size:13px;color:#606060;">
                Askor Ali &nbsp;·&nbsp; 4K Music Video &nbsp;·&nbsp; YouTube
              </p>
            </a>
          </td>
        </tr>

        <!-- Watch Button -->
        <tr>
          <td style="padding:16px 24px 24px;">
            <a href="https://teramerarishta.netlify.app" target="_blank"
              style="display:inline-block;background:#ff0000;color:#ffffff;font-size:14px;font-weight:700;
                     text-decoration:none;padding:12px 28px;border-radius:4px;letter-spacing:0.5px;">
              ▶&nbsp; Watch on YouTube
            </a>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="padding:0 24px;">
            <hr style="border:none;border-top:1px solid #f0f0f0;margin:0;"/>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:16px 24px;background:#fafafa;">
            <p style="margin:0;font-size:12px;color:#909090;line-height:1.6;">
              This video was shared with you via YouTube.<br/>
              &copy; 2024 YouTube, LLC · 901 Cherry Ave, San Bruno, CA 94066
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
